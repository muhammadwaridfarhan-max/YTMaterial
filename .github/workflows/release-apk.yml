name: Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Verify debug build
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk)"
          else
            echo "Debug APK not found"
            exit 1
          fi

      - name: Verify release build
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Release APK size: $(du -h app/build/outputs/apk/release/app-release.apk)"
          else
            echo "Release APK not found"
            exit 1
          fi
