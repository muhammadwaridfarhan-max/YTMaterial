name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            grep -oE "(compile against version|Android APIs|API level) [0-9]+[^.]*|Android Gradle plugin version [0-9.]+[^.]*|minimum recommended[^.]*|maximum recommended[^.]*|is currently compiled against [^.]*" build.log | sort -u | head -n 6 | while IFS= read -r line; do
              echo "::error::REQ ${line:0:300}"
            done
            grep -oE "Dependency '[^']+'" build.log | sort -u | head -n 4 | while IFS= read -r line; do
              echo "::error::DEP ${line:0:300}"
            done
            { grep -E '^e: ' build.log; grep -A4 'What went wrong' build.log; } | head -n 4 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
